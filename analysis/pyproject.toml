[project]
name = "catanroads"
version = "0.1.0"
description = "Healthcare-access interval bounds with retained detector reproduction modules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Retained synthetic detector evidence needs the original numerical stack.
detector = ["numpy>=1.24,<3", "scipy>=1.10,<2"]
dev = ["pytest>=7.0", "matplotlib>=3.6"]
baseline = ["shapely>=2,<3", "pyproj>=3.6,<4", "osmium>=4,<5"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["catanroads*"]
