name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install analysis dependencies
        run: python -m pip install -e "analysis[dev,baseline,detector]"
      - name: Python syntax
        run: python -m compileall -q analysis/catanroads analysis/tests
      - name: Run analysis tests
        env:
          PYTHONPATH: analysis
          MPLBACKEND: Agg
        run: python -m pytest analysis/tests -q
      - name: Check retained Earth Engine source statically
        run: node tools/validate_phase1.mjs
      - name: Check captured baseline preparation without rendering or network access
        run: python tools/test_prepare_baselines.py
      - name: Check retained temporal QA branches locally
        run: node tools/test_temporal_qa.mjs
      - name: Check README links, identity and negative controls
        run: |
          python tools/check_presentation.py . "Healthcare Access Uncertainty" healthcare-access-uncertainty
          python tools/test_presentation.py
