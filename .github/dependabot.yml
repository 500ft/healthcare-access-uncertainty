version: 2
# One grouped PR per ecosystem per month. Security updates are separate and
# still arrive as soon as an advisory is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/analysis"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
    # Keep ">=" ranges as written; only bump pins, or a range the new release falls outside.
    versioning-strategy: increase-if-necessary
    ignore:
      # These releases require Python >= 3.12; CI runs 3.11.
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "scipy"
        versions: [">=1.18"]
