version: 2
# One grouped PR per ecosystem per month. Security updates are separate and
# still arrive as soon as an advisory is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/analysis"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # numpy >= 2.5 requires Python >= 3.12; CI runs 3.11.
      - dependency-name: "numpy"
        versions: [">=2.5"]
